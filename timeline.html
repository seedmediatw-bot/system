<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>種子娛樂進度時間軸</title>
<meta name="description" content="種子娛樂內部時間軸，依月份查看概況、已確定事項與待回覆內容。">
<link rel="canonical" href="https://seedmediatw-bot.github.io/system/timeline.html">
  <style>
    :root { --paper:#fffefa; --ink:#26342f; --sub:#626f68; --line:#d8ded8; --accent:#466f7e; --dial-fill:#e2ecee; --dial-ink:#375765; }
    * { box-sizing:border-box; }
    html { color-scheme:light; }
    body { margin:0; background:var(--paper); color:var(--ink); font:20px/1.72 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
    button { font:inherit; cursor:pointer; color:inherit; }
    button:focus-visible,[tabindex]:focus-visible { outline:3px solid #527d92; outline-offset:5px; }
    .wrap { width:min(1120px,calc(100% - 80px)); margin:auto; padding:30px 0 100px; }
    .edition { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--ink); padding-bottom:20px; font-size:14px; }
    #motion-toggle { min-height:44px; border:0; background:none; color:var(--sub); font-size:14px; }
    .hero { display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:45px; padding:38px 0 30px; min-height:490px; }
    h1 { margin:0; font-size:clamp(40px,4.4vw,60px); line-height:1.25; letter-spacing:-.055em; }
    h1 span { display:block; white-space:nowrap; }
    .intro { color:var(--sub); font-size:18px; margin:26px 0 0; line-height:1.85; }
    .prototype-note { color:var(--sub); font-size:13px; margin:22px 0 0; }
    .time-instrument { min-width:0; text-align:center; }
    .dial { position:relative; width:min(460px,100%); aspect-ratio:1; margin:auto; user-select:none; touch-action:none; cursor:grab; isolation:isolate; }
    .dial.dragging { cursor:grabbing; }
    .dial svg { width:100%; height:100%; display:block; overflow:visible; pointer-events:none; }
    .dial-base { fill:none; stroke:#d8e0db; stroke-width:1; }
    .dial-tick { fill:none; stroke:#96acaa; stroke-width:1.35; stroke-linecap:round; }
    .dial-tick.major { stroke:var(--dial-ink); stroke-width:2; }
    .dial-pointer { fill:var(--dial-ink); transition:fill 350ms; }
    .dial-node { position:absolute; display:grid; place-items:center; width:42px; height:42px; transform:translate(-50%,-50%); border:0; background:transparent; font-size:19px; font-variant-numeric:tabular-nums; color:#717970; border-radius:50%; line-height:1; }
    .dial-node.has-record { color:var(--dial-ink); font-weight:750; background:var(--dial-fill); }
    .dial-node[aria-pressed="true"] { background:var(--dial-ink); color:white; }
    .dial-node:hover { box-shadow:0 0 0 4px #537c711b; }
    .dial-center { position:absolute; width:43%; aspect-ratio:1; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--dial-fill); color:var(--dial-ink); border:0; border-radius:50%; overflow:hidden; box-shadow:inset 0 0 0 1px #fff9; transition:background 400ms; touch-action:pan-y; }
    .dial-year { font-size:13px; line-height:1.2; position:relative; z-index:1; }
    .dial-number { font-family:Georgia,serif; font-size:clamp(76px,8.4vw,122px); font-weight:400; letter-spacing:-.075em; line-height:1.02; padding-right:.07em; position:relative; z-index:1; }
    .dial-read { font-size:12px; margin-top:5px; position:relative; z-index:1; white-space:nowrap; }
    .dial-center.reveal::after { content:""; position:absolute; inset:-20%; border-radius:43%; z-index:2; pointer-events:none; background:var(--dial-ink); animation:ink-wipe 680ms cubic-bezier(.65,0,.25,1) both; }
    .dial-center.reveal .dial-number { animation:number-in 680ms cubic-bezier(.16,1,.3,1); }
    @keyframes ink-wipe { 0% { transform:translateY(92%) rotate(-35deg); } 40% { transform:translateY(-8%) rotate(20deg); } 100% { transform:translateY(-117%) rotate(85deg); } }
    @keyframes number-in { 0%,30% { transform:translateY(34px); opacity:.1; } 100% { transform:none; opacity:1; } }
    .dial-burst { pointer-events:none; position:absolute; inset:0; z-index:-1; }
    .ripple { position:absolute; left:50%; top:50%; width:45%; aspect-ratio:1; border:1px solid var(--dial-ink); border-radius:50%; opacity:0; animation:ripple-out 950ms ease-out both; }
    .spark { position:absolute; left:50%; top:50%; width:3px; height:10px; border-radius:2px; background:var(--dial-ink); opacity:0; animation:spark-out 950ms cubic-bezier(.1,.7,.2,1) both; transform-origin:50% 50%; }
    @keyframes ripple-out { 0% { transform:translate(-50%,-50%) scale(1); opacity:.4; } 100% { transform:translate(-50%,-50%) scale(2.1); opacity:0; } }
    @keyframes spark-out { 0% { transform:translate(-50%,-50%) rotate(var(--a)) translateY(-80px) scale(.2); opacity:0; } 20% { opacity:.55; } 100% { transform:translate(-50%,-50%) rotate(var(--a)) translateY(var(--distance)) scale(.6); opacity:0; } }
    .deck-controls { display:flex; justify-content:center; align-items:center; gap:20px; font-size:15px; margin-top:2px; }
    .deck-controls button { width:44px; height:44px; border:1px solid var(--line); border-radius:50%; background:none; transition:background 160ms,transform 160ms; }
    .deck-controls button:hover { background:var(--ink); color:#fff; transform:scale(1.08); }
    .gesture-hint { color:var(--sub); font-size:13px; margin:9px 0 0; }
    .toolbar { border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:20px 0 15px; margin:25px 0 30px; }
    .filters { display:flex; flex-wrap:wrap; gap:10px; }
    .filter { min-height:46px; padding:9px 14px; border:1px solid transparent; border-radius:6px; background:transparent; font-size:17px; line-height:1.3; color:var(--sub); position:relative; transition:transform 180ms,background 220ms; }
    /* Pale UI adaptations, not official brand specifications: GlobeSend purple,
       China Daily News red (Sam), Nirvana blue; medical cyan is our choice,
       Deyu green follows Sam's case identity rather than its blue/gold crest. */
    [data-cat="dbs"] { --crm-bg:#eee4f8; --crm-ink:#63418a; }
    [data-cat="china"] { --crm-bg:#f8e3e1; --crm-ink:#963f3b; }
    [data-cat="medical"] { --crm-bg:#dff1f0; --crm-ink:#276a70; }
    [data-cat="fugui"] { --crm-bg:#e2eafa; --crm-ink:#36558b; }
    [data-cat="deyu"] { --crm-bg:#e2efdf; --crm-ink:#416d3a; }
    [data-cat="seed"] { --crm-bg:#f9dce5; --crm-ink:#873f5b; }
    .filter[data-cat="seed"] { display:inline-flex; align-items:center; gap:5px; padding:3px 14px 3px 4px; color:var(--crm-ink); background:linear-gradient(120deg,#fff0ee,#f6c5d7 65%,#f5dfe9); }
    .seed-stars { width:48px; height:40px; flex:none; overflow:visible; }
    .seed-star-body { transform-origin:50px 50px; transition:transform 450ms cubic-bezier(.16,1,.3,1); }
    .seed-main { transform-origin:50px 50px; animation:seed-breathe 3.8s ease-in-out infinite; }
    .seed-small { transform-box:fill-box; transform-origin:center; animation:seed-satellite 3.8s ease-in-out infinite; }
    .seed-small.second { animation-delay:.24s; }
    .seed-ring { fill:none; stroke:#bb5878; stroke-width:1.2; transform-origin:50px 50px; animation:seed-ring 3.8s ease-out infinite; }
    .filter[data-cat="seed"]:is(:hover,:focus-visible) .seed-star-body { transform:rotate(25deg) scale(1.2); }
    .filter[data-cat="seed"]:is(:hover,:focus-visible) .seed-main { animation-duration:1.35s; }
    .filter[data-cat="seed"]:is(:hover,:focus-visible) .seed-small { animation-duration:1.35s; }
    .filter[data-cat="seed"]:is(:hover,:focus-visible) .seed-ring { animation-duration:1.35s; }
    .filter[data-cat="seed"]:active .seed-star-body { transform:rotate(-15deg) scale(.88); }
    .seed-stars * { animation-play-state:paused; }
    .seed-visible .seed-stars * { animation-play-state:running; }
    html[data-page-hidden="true"] .seed-stars * { animation-play-state:paused; }
    @keyframes seed-breathe { 0%,100%{transform:scale(.72) rotate(-7deg)} 36%{transform:scale(1.08) rotate(5deg)} 65%{transform:scale(.84) rotate(-2deg)} }
    @keyframes seed-satellite { 0%,100%{transform:scale(.6);opacity:.55} 45%{transform:scale(1.2);opacity:1} 75%{transform:scale(.8);opacity:.75} }
    @keyframes seed-ring { 0%,30%{transform:scale(.45);opacity:0} 40%{opacity:.5} 85%,100%{transform:scale(1.15);opacity:0} }
    .filter:not([data-cat="all"]):not([data-cat="seed"]) { background:var(--crm-bg); color:var(--crm-ink); }
    .entry:not([data-cat="seed"]) .event-body { background:var(--crm-bg); }
    .entry:not([data-cat="seed"]) .dot { border-color:var(--crm-ink); }
    .entry:not([data-cat="seed"]) .tag { color:var(--crm-ink); }
    .filter:hover { transform:translateY(-2px); }
    .filter[aria-pressed="true"] { color:var(--ink); border-color:currentColor; }
    .filter[aria-pressed="true"]::after { content:""; position:absolute; bottom:4px; left:calc(50% - 8px); width:16px; height:2px; background:currentColor; }
    .global-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:20px; margin-top:10px; }
    .global-toggle { min-height:44px; border:0; background:none; font-size:14px; color:var(--sub); padding:5px 0; text-decoration:underline; text-underline-offset:5px; }
    .timeline-heading { display:flex; justify-content:space-between; align-items:baseline; gap:20px; margin:32px 0 26px; }
    .timeline-heading h2 { font-size:26px; margin:0; }.timeline-heading p { font-size:15px; color:var(--sub); margin:0; }
    .months { display:grid; }.month { border-top:1px solid var(--line); scroll-margin-top:24px; }.month-heading { margin:0; }
    .month-toggle { display:grid; grid-template-columns:minmax(0,1fr) auto 28px; width:100%; min-height:116px; padding:20px 8px; gap:18px; align-items:center; border:0; background:none; text-align:left; }
    .month-toggle:hover { background:#f3f4ee; }
    .month-title { display:flex; gap:22px; align-items:center; font-size:20px; }
    .month-numeral { font:400 65px/1 Georgia,serif; letter-spacing:-4px; width:83px; color:var(--sub); transition:color 250ms,transform 400ms; }
    .month-toggle[aria-expanded="true"] .month-numeral { color:var(--accent); transform:translateX(5px); }
    .month-count { color:var(--sub); font-size:15px; white-space:nowrap; }
    .chevron { width:28px; height:28px; position:relative; }
    .chevron::before,.chevron::after { content:""; position:absolute; background:currentColor; width:20px; height:1px; left:4px; top:14px; transition:transform 300ms; }
    .chevron::after { transform:rotate(90deg); }.month-toggle[aria-expanded="true"] .chevron::after { transform:rotate(0); }
    .month-panel { overflow:hidden; }.month-panel[hidden] { display:none; }
    .timeline { position:relative; padding-bottom:30px; }
    .timeline::before { content:""; position:absolute; top:0; bottom:0; left:108px; width:1px; background:var(--line); }
    .entry { position:relative; display:grid; grid-template-columns:78px minmax(0,1fr); gap:58px; padding:10px 0; align-items:start; }
    .date { padding-top:21px; font-size:17px; color:var(--sub); text-align:right; white-space:nowrap; }
    .dot { position:absolute; left:103px; top:38px; width:11px; height:11px; border:2px solid var(--ink); border-radius:50%; background:var(--paper); }
    .event-body { min-width:0; padding:19px 22px 23px; border-radius:7px; border:1px solid transparent; transition:transform 200ms; }
    .entry[data-cat="seed"] .event-body { background:linear-gradient(115deg,#fff0ee,#f9dce5 65%,#f5e4ed); border-bottom-color:transparent; }
    .entry[data-cat="seed"] .tag { color:var(--crm-ink); }
    .entry[data-cat="seed"] .dot { border-color:var(--crm-ink); }
    @media(hover:hover) { .event-body:hover { transform:translateX(4px); } }
    .event-title { font-size:22px; line-height:1.5; font-weight:650; margin:0; }
    .tag { font-size:13px; color:var(--sub); margin-left:14px; font-weight:400; vertical-align:2px; }
    .note { font-size:19px; color:#45544e; margin:7px 0 0; line-height:1.8; }
    .state { display:flex; align-items:baseline; gap:10px; font-size:17px; line-height:1.7; margin:10px 0 0; }
    .state-label { flex-shrink:0; font-weight:700; }.state.pending { color:#82502d; }.state.decided { color:#43603c; }
    .latest { display:flex; align-items:center; gap:14px; color:var(--sub); margin:22px 0 0 102px; font-size:14px; }
    .latest::before { content:""; width:13px; height:13px; border-radius:50%; background:var(--ink); }
    .data-footnote { margin:45px 0 0; padding-top:20px; border-top:1px solid var(--line); font-size:13px; color:var(--sub); max-width:750px; }.empty { padding:40px 0; }
    @media(max-width:800px) {
      .wrap { width:calc(100% - 40px); }.hero { grid-template-columns:1fr; gap:24px; padding-top:40px; }.hero-copy { max-width:540px; }
      h1 { font-size:44px; }.time-instrument { width:min(470px,100%); justify-self:center; }.dial-number { font-size:120px; }
      .global-actions { justify-content:flex-start; }.entry { grid-template-columns:60px minmax(0,1fr); gap:35px; }
      .timeline::before { left:76px; }.dot { left:71px; }.latest { margin-left:70px; }
    }
    @media(max-width:470px) {
      .wrap { width:calc(100% - 32px); }.edition { font-size:12px; }.hero { padding-top:30px; gap:23px; } h1 { font-size:40px; }.intro { font-size:17px; }
      .dial-number { font-size:84px; }.dial-year { font-size:12px; }.dial-read { font-size:11px; }.dial-node { width:34px; height:34px; font-size:16px; }
      .filter { font-size:16px; padding:9px 11px; }.filters { gap:9px; }.toolbar { margin-top:26px; }
      .timeline-heading { display:block; }.timeline-heading p { margin-top:6px; }
      .month-toggle { min-height:100px; gap:10px; }.month-title { gap:12px; font-size:17px; }.month-numeral { font-size:54px; width:66px; }.month-count { font-size:13px; }
      .entry { display:block; padding:10px 0 10px 23px; }.timeline::before { left:4px; }.dot { left:-1px; top:21px; }
      .date { display:block; padding:0 0 7px; text-align:left; font-size:15px; }.event-body { padding:15px 15px 19px; }
      .event-title { font-size:21px; }.note { font-size:18px; }.tag { display:block; margin:4px 0 0; }.state { font-size:16px; gap:8px; }.latest { margin-left:-2px; }
    }
    html[data-motion="off"] *,html[data-motion="off"] *::before,html[data-motion="off"] *::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }
    /* ===== 區塊（可收合、可拖曳） ===== */
  section.block{margin-top:56px;}
  .bhead{
    display:flex;align-items:center;gap:10px;
    padding-bottom:12px;border-bottom:1px solid var(--line);
  }
  .bhead h2{font-size:1.05rem;font-weight:600;letter-spacing:.08em;}
  .bhead .sub-note{font-size:.72rem;color:var(--sub);font-weight:400;letter-spacing:.05em;}
  .drag-handle{
    cursor:grab;color:#555;font-size:.9rem;user-select:none;
    line-height:1;padding:2px 2px 2px 0;
  }
  .drag-handle:active{cursor:grabbing;}
  .toggle-btn{
    margin-left:auto;flex-shrink:0;
    border:1px solid #aaa;background:none;border-radius:4px;
    width:22px;height:22px;font-size:.85rem;line-height:1;color:#444;
    cursor:pointer;font-family:inherit;transition:.15s;
  }
  .toggle-btn:hover{border-color:var(--ink);color:var(--ink);}
  section.block.collapsed .bbody{display:none;}
  section.block.drag-over{border-top:2px solid var(--accent);}
  section.block.dragging{opacity:.4;}

  /* 洽談中 */
  .talk{
    display:grid;grid-template-columns:190px 1fr;gap:0 20px;
    padding:14px 18px;margin-top:14px;border-radius:8px;background:#f6f6f4;
    align-items:start;cursor:pointer;position:relative;
  }
  .talk .name{font-size:.92rem;font-weight:500;line-height:1.6;padding-right:20px;}
  .talk .status-chip{
    display:inline-block;font-size:.68rem;letter-spacing:.08em;
    padding:1px 8px;border-radius:3px;margin-top:6px;
  }
  .talk .now{font-size:.85rem;color:#555;}
  .talk .now .meta{font-size:.75rem;color:var(--sub);margin-top:4px;letter-spacing:.03em;}
  .talk .late{color:var(--warn);}
  .st-quoted{color:#1A5276;background:#D6EAF8;}
  .st-mou{color:#6C3483;background:#E8DAEF;}
  .st-willing{color:#9A7D0A;background:#FDEBD0;}
  .st-follow{color:#616A6B;background:#ECECEA;}
  .st-signed{color:#1E8449;background:#D5F5E3;}

  /* 客戶展開箭頭 */
  .talk .chev{
    position:absolute;top:16px;right:16px;color:#c0c0bc;font-size:.75rem;
    transition:transform .15s;
  }
  .talk.open .chev{transform:rotate(90deg);}

  /* 客戶展開內容：迷你時間軸 → 概況說明 */
  .talk .detail{display:none;grid-column:1/-1;margin-top:12px;}
  .talk.open .detail{display:block;}
  .hist{border-left:1px solid #dcdcd8;padding-left:16px;margin-left:2px;}
  .hist .h-item{font-size:.8rem;color:#555;padding:3px 0;}
  .hist .h-date{color:var(--sub);font-variant-numeric:tabular-nums;margin-right:10px;letter-spacing:.03em;}
  .overview{
    margin-top:14px;padding:12px 16px;background:#fdfdfc;
    border:1px solid var(--line);border-radius:6px;
    font-size:.84rem;color:#444;
  }
  .overview .ov-label{
    display:block;font-size:.7rem;letter-spacing:.14em;
    color:var(--sub);margin-bottom:4px;
  }

  @media (max-width:560px){
    .talk{grid-template-columns:1fr;gap:8px 0;}
  }

  /* 同事備忘 */
  .memo-form{margin-top:16px;}
  .memo-names{display:flex;gap:8px;flex-wrap:wrap;}
  .memo-names button{
    border:1px solid var(--line);background:none;border-radius:999px;
    padding:3px 14px;font-size:.8rem;color:var(--sub);cursor:pointer;
    font-family:inherit;letter-spacing:.05em;transition:.15s;
  }
  .memo-names button.on{border-color:var(--ink);color:var(--ink);}
  .memo-form textarea{
    width:100%;margin-top:10px;padding:10px 14px;
    border:1px solid var(--line);border-radius:8px;background:#fff;
    font-family:inherit;font-size:.85rem;color:var(--ink);line-height:1.7;
    resize:vertical;outline:none;
  }
  .memo-form textarea:focus{border-color:#aaa;}
  .memo-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:8px;}
  .memo-status{font-size:.78rem;color:var(--sub);}
  .memo-status.err{color:var(--warn);}
  #memo-send{
    border:1px solid #555;background:none;border-radius:6px;
    padding:4px 18px;font-size:.82rem;color:#333;cursor:pointer;
    font-family:inherit;letter-spacing:.08em;transition:.15s;
  }
  #memo-send:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
  #memo-send:disabled{opacity:.4;cursor:default;}
  .memo-item{
    padding:10px 42px 10px 16px;margin-top:12px;border-radius:8px;
    background:#f6f6f4;font-size:.85rem;color:#444;position:relative;
  }
  .memo-item .m-meta{font-size:.75rem;color:var(--sub);margin-right:10px;letter-spacing:.03em;}
  .memo-del{
    position:absolute;right:10px;top:8px;
    border:none;background:none;color:#c0c0bc;font-size:.85rem;
    cursor:pointer;font-family:inherit;padding:2px 6px;transition:.15s;
  }
  .memo-del:hover{color:var(--warn);}

  /* 個人自動化工程 */
  .auto-item{
    padding:14px 18px;margin-top:14px;border-radius:8px;
    background:#f4f0f8;
  }
  .auto-item .t{font-size:.92rem;font-weight:500;}
  .auto-item .d{font-size:.84rem;color:#555;margin-top:4px;}

  /* 已結案／暫緩 */
  .closed-item{
    padding:14px 18px;margin-top:14px;border-radius:8px;
    background:#f6f6f4;
  }
  .closed-item .t{font-size:.92rem;font-weight:500;color:#666;}
  .closed-item .d{font-size:.84rem;color:#777;margin-top:4px;}
  .empty-hint{margin-top:14px;font-size:.8rem;color:var(--sub);letter-spacing:.05em;}


    body.locked .wrap { display:none; }
    #login-panel { width:min(480px,calc(100% - 40px)); margin:15vh auto; }
    #login-panel input { width:100%; min-height:48px; font:inherit; padding:8px; }
    #login-panel button { min-height:48px; margin-top:12px; padding:8px 20px; }
    #login-status { font-size:17px; color:#873f5b; }

    .entry[data-cat="other"] { --crm-bg:#eeefed;--crm-ink:#465449; }

</style>
</head>

<script>

const API_BASE="https://hr-system123.seedmediatw.workers.dev";
const PASS_LS="seedtl.pass";
let TL_PASS="";
try{TL_PASS=localStorage.getItem(PASS_LS)||"";}catch(_){}
let DATA={events:[],memos:[],talks:[]};
const LATE_DAYS=7;
const currentCat="all";
const escapeHtml=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function normalizeDate(value){
  const s=String(value||"").trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const m=s.match(/^(\d{1,2})[-/](\d{1,2})$/);
  // Legacy endpoint returns month/day for its fixed 2026 dataset.
  if(m)return "2026-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0");
  return "";
}
function categoryOf(e){
  const raw=String(e.cat||e.category||"").trim();
  const aliases={dbs:"dbs",星展:"dbs","星展 DBS":"dbs",deyu:"deyu",德育:"deyu",seed:"seed",種子內部:"seed",china:"china",中華日報:"china",medical:"medical",錢慶文醫療:"medical",錢慶文醫療平台:"medical",fugui:"fugui",富貴集團:"fugui"};
  // The old service collapses unknown categories to seed. Specific case names
  // in titles identify display groups only; Notion records are never rewritten.
  const title=String(e.title||"");
  if(/錢慶文/.test(title))return "medical";
  if(/富貴集團|富貴|Jerry拿督/.test(title))return "fugui";
  if(/AI\s*Workshop|AI\s*工作坊/i.test(title))return "seed";
  if(/中華日報/.test(title))return "china";
  return aliases[raw]||"other";
}
async function tlLoad(password){
  const res=await fetch(API_BASE+"/api/timeline/load",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password}),signal:AbortSignal.timeout(30000)});
  if(res.status===401)throw new Error("密碼不正確，請再試一次。");
  if(!res.ok)throw new Error("資料讀取失敗，請稍後再試。");
  const data=await res.json();
  if(!Array.isArray(data.events)||!Array.isArray(data.memos)||!Array.isArray(data.talks))throw new Error("資料格式不完整，暫不顯示。");
  return data;
}
let initialized=false;
async function boot(password){
  const status=document.getElementById("login-status"),button=document.getElementById("login-submit");
  button.disabled=true;status.textContent="正在驗證並讀取資料…";
  try{
    const data=await tlLoad(password);
    DATA=data;TL_PASS=password;
    try{localStorage.setItem(PASS_LS,password);}catch(_){}
    document.getElementById("login-panel").hidden=true;
    document.body.classList.remove("locked");
    const latest=DATA.events.map(e=>normalizeDate(e.date)).filter(Boolean).sort().at(-1);
    document.getElementById("updated").textContent=latest?"最新事件："+latest:"目前沒有事件";
    renderTalks();renderMemos(DATA.memos);
    if(!initialized){initTimeline();initialized=true;}
    applyCollapseState();
  }catch(e){status.textContent=e.name==="TimeoutError"?"連線逾時，請再試一次。":e.message;}
  finally{button.disabled=false;}
}
document.getElementById("login-form").addEventListener("submit",e=>{e.preventDefault();boot(document.getElementById("login-password").value.trim());});

/* ---------- 同事備忘 ---------- */
const memoStatus = (msg, isErr) => {
  const el = document.getElementById("memo-status");
  el.textContent = msg || "";
  el.classList.toggle("err", !!isErr);
};

function renderMemos(memos){
  const box = document.getElementById("memo-items");
  box.innerHTML = (memos && memos.length)
    ? memos.map(m => `<div class="memo-item"><span class="m-meta">${escapeHtml((m.date||"").slice(5))}｜${escapeHtml(m.name)}</span>${escapeHtml(m.content)}<button class="memo-del" data-id="${escapeHtml(m.id)}" title="刪除這則備忘">✕</button></div>`).join("")
    : `<div class="empty-hint">目前沒有新備忘</div>`;
}

async function loadMemos(){
  try{
    const res = await fetch(API_BASE + "/api/memos", { headers: { "X-TL-Pass": TL_PASS } });
    if(!res.ok) throw new Error(res.status);
    const { memos } = await res.json();
    DATA.memos = memos;
    renderMemos(memos);
  }catch(e){
    document.getElementById("memo-items").innerHTML = `<div class="empty-hint">備忘讀取失敗，請重新整理</div>`;
  }
}

/* 備忘刪除：網頁移除＋Notion 同步封存（可從 Notion 垃圾桶救回） */
document.getElementById("memo-items").addEventListener("click", async ev=>{
  const btn = ev.target.closest(".memo-del");
  if(!btn) return;
  if(!confirm("確定刪除這則備忘？（Notion 端會一併移除）")) return;
  btn.disabled = true;
  try{
    const res = await fetch(API_BASE + "/api/memo/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-TL-Pass": TL_PASS },
      body: JSON.stringify({ id: btn.dataset.id }),
    });
    if(!res.ok) throw new Error(res.status);
    loadMemos();
  }catch(e){
    btn.disabled = false;
    alert("刪除失敗，請稍後再試");
  }
});

/* 名字選擇（記住上次選誰） */
(function(){
  const saved = localStorage.getItem("seedtl.memoName") || "";
  document.querySelectorAll("#memo-names button").forEach(b=>{
    if(b.dataset.n === saved) b.classList.add("on");
    b.addEventListener("click", ()=>{
      document.querySelectorAll("#memo-names button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      localStorage.setItem("seedtl.memoName", b.dataset.n);
    });
  });
})();

document.getElementById("memo-send").addEventListener("click", async ()=>{
  const input = document.getElementById("memo-input");
  const name = document.querySelector("#memo-names button.on")?.dataset.n;
  const content = input.value.trim();
  if(!name){ memoStatus("請先選你的名字", true); return; }
  if(!content){ memoStatus("內容是空的", true); return; }
  const btn = document.getElementById("memo-send");
  btn.disabled = true; memoStatus("送出中…");
  try{
    const res = await fetch(API_BASE + "/api/memo", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-TL-Pass": TL_PASS },
      body: JSON.stringify({ content, name }),
    });
    if(!res.ok) throw new Error(res.status);
    input.value = "";
    memoStatus("已送出 ✓");
    setTimeout(()=>memoStatus(""), 3000);
    loadMemos();
  }catch(e){
    memoStatus("送出失敗，請稍後再試", true);
  }finally{
    btn.disabled = false;
  }
});

/* ---------- 洽談中／已暫緩（資料來自載入時的 talks）---------- */
const ST_CLASS = {
  "已簽約":"st-signed", "MOU 待簽":"st-mou", "有意願待簽約":"st-willing",
  "已報價":"st-quoted", "報價中":"st-quoted", "製作中":"st-willing",
  "跟進中":"st-follow", "戰略夥伴":"st-follow",
};
const fmtMD = iso => iso ? iso.slice(5) : "—";
function daysSinceISO(iso){
  if(!iso) return null;
  const t = new Date(iso + "T00:00:00");
  if(isNaN(t)) return null;
  return Math.floor((Date.now() - t.getTime()) / 86400000);
}

/* 歷史日誌：把「07/17　內容」拆成日期＋內文的小時間軸 */
function logHtml(t){
  const lines = t.log || [];
  if(!lines.length) return `<div style="color:var(--sub)">（尚無歷史日誌，到 Notion 客戶頁面內文加一行「日期　內容」即可）</div>`;
  return `<div class="hist" style="margin-top:6px">${lines.map(l=>{
    const m = /^([0-9]{1,2}\/[0-9]{1,2}|[0-9]{1,2}月[^\s　]*)[\s　]+([\s\S]*)$/.exec(l);
    return m
      ? `<div class="h-item"><span class="h-date">${escapeHtml(m[1])}</span>${escapeHtml(m[2])}</div>`
      : `<div class="h-item">${escapeHtml(l)}</div>`;
  }).join("")}</div>`;
}

function renderTalks(){
  const box = document.getElementById("talks");
  const closedBox = document.getElementById("closed-items");
  const talks = DATA.talks || [];
  const byDate = (a,b) => (a.last||"").localeCompare(b.last||"");
  const CLOSED_ST = ["結案","結束","暫停","暫緩","已簽約"];
  const named = talks.filter(t => t.name);
  const active = named.filter(t => !CLOSED_ST.includes(t.status)).sort(byDate);
  const closed = named.filter(t => ["結案","結束","暫停","暫緩"].includes(t.status)).sort(byDate);
  box.innerHTML = active.length ? active.map(t => {
    const d = daysSinceISO(t.last);
    const late = (d !== null && d > LATE_DAYS) ? `<span class="late">・逾 ${d} 天</span>` : "";
    return `
    <div class="talk">
      <div class="name">${escapeHtml(t.name)}<br><span class="status-chip ${ST_CLASS[t.status]||"st-follow"}">${escapeHtml(t.status||"—")}</span></div>
      <div class="now">${escapeHtml(t.action||"（尚未填下一步行動）")}<div class="meta">最近聯繫：${escapeHtml(fmtMD(t.last))}${late}${t.next ? "　下次跟進：" + escapeHtml(fmtMD(t.next)) : ""}</div></div>
      <span class="chev">▶</span>
      <div class="detail">
        <div class="overview"><span class="ov-label">歷 史 日 誌</span>${logHtml(t)}</div>
      </div>
    </div>`;
  }).join("") : `<div class="empty-hint">CRM 目前沒有洽談中客戶</div>`;
  closedBox.innerHTML = closed.length
    ? closed.map(t=>`<div class="closed-item"><div class="t">${escapeHtml(t.name)}｜${escapeHtml(t.status)}</div><div class="d">${escapeHtml((t.log&&t.log[0])||t.action||"")}</div></div>`).join("")
    : `<div class="empty-hint">尚無結案／暫緩紀錄</div>`;
}

document.getElementById("talks").addEventListener("click", ev=>{
  const card = ev.target.closest(".talk");
  if(card) card.classList.toggle("open");
});


/* ===== 區塊收合（每個篩選頁面狀態獨立記憶）===== */
const LS_COLLAPSE = "seedtl.collapsed.v2";
function loadCollapsed(){
  try{ return JSON.parse(localStorage.getItem(LS_COLLAPSE)) || {}; }catch(e){ return {}; }
}
let collapseState = loadCollapsed();
function pageState(){
  if(!collapseState[currentCat]) collapseState[currentCat] = { closed:true };
  return collapseState[currentCat];
}
function applyCollapseState(){
  const st = pageState();
  document.querySelectorAll("#blocks > section.block").forEach(sec=>{
    sec.classList.toggle("collapsed", !!st[sec.dataset.key]);
    sec.querySelector(".toggle-btn").textContent = st[sec.dataset.key] ? "＋" : "−";
  });
}
(function initCollapse(){
  document.querySelectorAll("#blocks > section.block").forEach(sec=>{
    sec.querySelector(".toggle-btn").addEventListener("click", ()=>{
      const st = pageState();
      st[sec.dataset.key] = !st[sec.dataset.key];
      try{ localStorage.setItem(LS_COLLAPSE, JSON.stringify(collapseState)); }catch(e){}
      applyCollapseState();
    });
  });
})();

/* ===== 區塊拖曳排序（順序記憶）===== */
const LS_ORDER = "seedtl.order";
(function initDrag(){
  const container = document.getElementById("blocks");
  try{
    const order = JSON.parse(localStorage.getItem(LS_ORDER));
    if(Array.isArray(order)){
      order.forEach(key=>{
        const sec = container.querySelector(`section[data-key="${key}"]`);
        if(sec) container.appendChild(sec);
      });
    }
  }catch(e){}
  let dragging = null;
  container.querySelectorAll("section.block").forEach(sec=>{
    const handle = sec.querySelector(".drag-handle");
    handle.addEventListener("mousedown", ()=> sec.setAttribute("draggable","true"));
    handle.addEventListener("touchstart", ()=> sec.setAttribute("draggable","true"), {passive:true});
    sec.addEventListener("dragstart", ev=>{
      dragging = sec;
      sec.classList.add("dragging");
      ev.dataTransfer.effectAllowed = "move";
    });
    sec.addEventListener("dragend", ()=>{
      sec.classList.remove("dragging");
      sec.removeAttribute("draggable");
      container.querySelectorAll(".drag-over").forEach(x=>x.classList.remove("drag-over"));
      dragging = null;
      const order = [...container.querySelectorAll("section.block")].map(s=>s.dataset.key);
      try{ localStorage.setItem(LS_ORDER, JSON.stringify(order)); }catch(e){}
    });
    sec.addEventListener("dragover", ev=>{
      ev.preventDefault();
      if(!dragging || dragging === sec) return;
      container.querySelectorAll(".drag-over").forEach(x=>x.classList.remove("drag-over"));
      sec.classList.add("drag-over");
    });
    sec.addEventListener("drop", ev=>{
      ev.preventDefault();
      if(!dragging || dragging === sec) return;
      const rect = sec.getBoundingClientRect();
      const before = ev.clientY < rect.top + rect.height/2;
      container.insertBefore(dragging, before ? sec : sec.nextSibling);
      sec.classList.remove("drag-over");
    });
  });
})();


function initTimeline(){

    const CAT = {
      all: "全部",
      dbs: "星展 DBS",
      china: "中華日報",
      medical: "錢慶文醫療",
      fugui: "富貴集團",
      deyu: "德育",
      seed: "種子內部"
    };

    CAT.other="其他";
    const EVENTS=DATA.events.map(e=>({...e,date:normalizeDate(e.date),cat:categoryOf(e)})).sort((a,b)=>a.date.localeCompare(b.date));
    const monthNames = new Intl.DateTimeFormat("zh-TW", { year: "numeric", month: "long" });
    const storageKey = "seed.timeline.months.v3";
    let activeCat = "all";
    let storedState = {};
    try { storedState = JSON.parse(localStorage.getItem(storageKey)) || {}; } catch (_) {}

    const esc = value => String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    const dateLabel = iso => {
      const [, month, day] = iso.split("-");
      return `${Number(month)}/${Number(day)}`;
    };

    const monthLabel = key => monthNames.format(new Date(`${key}-01T00:00:00`));

    const seedObserver = new IntersectionObserver(entries=>entries.forEach(entry=>entry.target.classList.toggle('seed-visible',entry.isIntersecting)),{threshold:0});
    const seedStars = `<svg class="seed-stars" viewBox="0 0 100 90" aria-hidden="true"><defs><linearGradient id="seed-pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd8cf"/><stop offset=".5" stop-color="#ee8caa"/><stop offset="1" stop-color="#bb547b"/></linearGradient></defs><circle class="seed-ring" cx="50" cy="50" r="35"/><g class="seed-star-body" fill="url(#seed-pink)"><path class="seed-main" d="M50 16 Q56 44 82 50 Q56 56 50 84 Q44 56 18 50 Q44 44 50 16Z"/><path class="seed-small" d="M24 3 Q27 16 40 19 Q27 22 24 35 Q21 22 8 19 Q21 16 24 3Z"/><path class="seed-small second" d="M83 57 Q86 68 96 71 Q86 74 83 85 Q80 74 70 71 Q80 68 83 57Z"/></g></svg>`;
    function filtersHtml() {
      seedObserver.disconnect();
      document.getElementById("filters").innerHTML = Object.entries(CAT).filter(([key])=>key!=="other"||EVENTS.some(e=>e.cat==="other")).map(([key, label]) =>
        `<button class="filter" type="button" data-cat="${key}" aria-pressed="${key === activeCat}">${key === 'seed' ? seedStars : ''}${label}</button>`
      ).join("");
      seedObserver.observe(document.querySelector('.filter[data-cat="seed"]'));
    }

    function eventHtml(event) {
      return `<article class="entry" data-cat="${event.cat}">
        <time class="date" datetime="${event.date}">${event.date?dateLabel(event.date):"未填日期"}</time>
        <span class="dot" aria-hidden="true"></span>
        <div class="event-body">
          <h3 class="event-title">${esc(event.title)}<span class="tag">${esc(event.cat==="other"?(event.category||"其他"):CAT[event.cat])}</span></h3>
          ${event.note ? `<p class="note">${esc(event.note)}</p>` : ""}
          ${event.decided ? `<p class="state decided"><span class="state-label">已確定</span><span>${esc(event.decided)}</span></p>` : ""}
          ${event.pending ? `<p class="state pending"><span class="state-label">待回覆</span><span>${esc(event.pending)}</span></p>` : ""}
        </div>
      </article>`;
    }

    function render() {
      filtersHtml();
      document.querySelectorAll('#blocks > .legacy').forEach(section=>{section.hidden=activeCat!=="all";});
      const filtered = EVENTS.filter(event => activeCat === "all" || event.cat === activeCat);
      const grouped = filtered.reduce((map, event) => {
        const key = event.date ? event.date.slice(0, 7) : "undated";
        (map[key] ||= []).push(event);
        return map;
      }, {});
      const months = Object.keys(grouped).sort();
      const datedMonths = months.filter(key=>key!=="undated");
      const latestMonth = datedMonths.at(-1);
      const container = document.getElementById("months");

      if (!months.length) {
        container.innerHTML = `<p class="empty">目前這個分類沒有事件。</p>`;
      } else {
        container.innerHTML = months.map(key => {
          const stateKey = `${activeCat}:${key}`;
          const expanded = storedState[stateKey] ?? (key === latestMonth || key === "undated");
          const panelId = `month-${activeCat}-${key}`;
          return `<section class="month" data-month="${key}">
            <h3 class="month-heading"><button class="month-toggle" type="button" aria-expanded="${expanded}" aria-controls="${panelId}">
              <span class="month-title"><span class="month-numeral" aria-hidden="true">${key==="undated"?"?":key.slice(5)}</span>${key==="undated"?"日期待確認":monthLabel(key)}</span>
              <span class="month-count">${grouped[key].length} 件</span>
              <span class="chevron" aria-hidden="true"></span>
            </button></h3>
            <div class="month-panel" id="${panelId}" ${expanded ? "" : "hidden"}>
              <div class="timeline">${grouped[key].map(eventHtml).join("")}</div>
            </div>
          </section>`;
        }).join("");
      }

      document.getElementById("visible-summary").textContent = `${CAT[activeCat]}・${filtered.length} 件・${datedMonths.length} 個月份${grouped.undated?"・"+grouped.undated.length+" 件日期待確認":""}`;
      syncDial();
    }

    function saveState() {
      try { localStorage.setItem(storageKey, JSON.stringify(storedState)); } catch (_) {}
    }

    document.getElementById("filters").addEventListener("click", event => {
      const button = event.target.closest("[data-cat]");
      if (!button) return;
      activeCat = button.dataset.cat;
      selectedMonth = EVENTS.filter(e=>e.date&&(activeCat==='all'||e.cat===activeCat)).at(-1)?.date.slice(0,7) || archiveMonths.at(-1) || new Date().toISOString().slice(0,7);
      YEAR=selectedMonth.slice(0,4);document.getElementById("dial-year-select").value=YEAR;
      render();
      document.querySelector('.filter[data-cat="'+activeCat+'"]').focus({preventScroll:true});
    });

    document.getElementById("months").addEventListener("click", event => {
      const button = event.target.closest(".month-toggle");
      if (!button) return;
      const month = button.closest(".month").dataset.month;
      const nextExpanded = button.getAttribute("aria-expanded") !== "true";
      const panel = document.getElementById(button.getAttribute("aria-controls"));
      button.setAttribute("aria-expanded", String(nextExpanded));
      animatePanel(panel, nextExpanded);
      storedState[`${activeCat}:${month}`] = nextExpanded;
      saveState();
    });

    document.getElementById("expand-all").addEventListener("click", () => {
      document.querySelectorAll(".month").forEach(section => {
        const month = section.dataset.month;
        section.querySelector(".month-toggle").setAttribute("aria-expanded", "true");
        animatePanel(section.querySelector(".month-panel"), true);
        storedState[`${activeCat}:${month}`] = true;
      });
      saveState();
    });

    document.getElementById("collapse-past").addEventListener("click", () => {
      const sections = [...document.querySelectorAll('.month:not([data-month="undated"])')];
      sections.forEach((section, index) => {
        const expanded = index === sections.length - 1;
        const month = section.dataset.month;
        section.querySelector(".month-toggle").setAttribute("aria-expanded", String(expanded));
        animatePanel(section.querySelector(".month-panel"), expanded);
        storedState[`${activeCat}:${month}`] = expanded;
      });
      saveState();
    });


    const archiveMonths = [...new Set(EVENTS.filter(e=>e.date).map(e=>e.date.slice(0,7)))].sort();
    let selectedMonth = archiveMonths.at(-1) || new Date().toISOString().slice(0,7);
    let YEAR = selectedMonth.slice(0,4);
    const motionQuery=matchMedia('(prefers-reduced-motion: reduce)');
    let motionEnabled=!motionQuery.matches;
    const panelAnimations=new Map();
    const dial=document.getElementById('dial');
    const center=document.getElementById('dial-center');
    const ticks=document.getElementById('dial-ticks');
    const nodes=document.getElementById('dial-nodes');
    const burst=document.getElementById('dial-burst');
    const STEP=Math.PI/6,TAU=Math.PI*2;
    const monthKey=i=>YEAR+'-'+String(i+1).padStart(2,'0');
    const monthCount=i=>EVENTS.filter(e=>e.date.startsWith(monthKey(i))&&(activeCat==='all'||e.cat===activeCat)).length;
    const wrapAngle=a=>Math.atan2(Math.sin(a),Math.cos(a));
    const modulo=(n,d)=>(n%d+d)%d;
    const monthFromAngle=a=>modulo(-Math.round(a/STEP),12);
    let angle=-(Number(selectedMonth.slice(5))-1)*STEP,targetAngle=angle,velocity=0;
    let phase='idle',raf=0,previousTime=0,coastStarted=0,pointer=null,hoverAngle=null,shown=true,ignoreClick=false;
    const bends=Array.from({length:60},()=>({x:0,v:0}));
    ticks.innerHTML=bends.map((_,i)=>'<path class="dial-tick '+(i%5===0?'major':'')+'"/>').join('');
    nodes.innerHTML=Array.from({length:12},(_,i)=>'<button class="dial-node" data-index="'+i+'" type="button">'+String(i+1).padStart(2,'0')+'</button>').join('');
    const tickEls=[...ticks.children],nodeEls=[...nodes.children];
    function applyMotion(){
      document.documentElement.dataset.motion=motionEnabled?'on':'off';
      const control=document.getElementById('motion-toggle');
      control.textContent=motionEnabled?'動態：開':'動態：關';
      control.setAttribute('aria-pressed',String(motionEnabled));
      if(!motionEnabled){
        panelAnimations.forEach(a=>a.finish());
        stopSpin(); angle=-(Number(selectedMonth.slice(5))-1)*STEP;
        bends.forEach(b=>{b.x=0;b.v=0;});burst.replaceChildren();center.classList.remove('reveal');paint();
      }
    }
    function animatePanel(panel,open){
      const height=panel.hidden?0:panel.getBoundingClientRect().height;
      const prev=panelAnimations.get(panel);if(prev)prev.cancel();
      panelAnimations.delete(panel);panel.hidden=false;
      if(!motionEnabled||motionQuery.matches){panel.hidden=!open;return;}
      const animation=panel.animate([{height:height+'px',opacity:height?1:0},{height:(open?panel.scrollHeight:0)+'px',opacity:open?1:0}],{duration:460,easing:'cubic-bezier(.2,.8,.2,1)'});
      panelAnimations.set(panel,animation);
      animation.onfinish=()=>{panel.hidden=!open;panelAnimations.delete(panel);};
    }
    function stopSpin(){
      cancelAnimationFrame(raf);raf=0;previousTime=0;velocity=0;phase='idle';
      if(pointer&&dial.hasPointerCapture(pointer.id))dial.releasePointerCapture(pointer.id);
      pointer=null;hoverAngle=null;dial.classList.remove('dragging');
    }
    function paint(){
      const point=(r,a,b=0)=>[(250+r*Math.cos(a)-b*Math.sin(a)).toFixed(2),(250+r*Math.sin(a)+b*Math.cos(a)).toFixed(2)];
      tickEls.forEach((el,i)=>{
        const a=angle+i*TAU/60-Math.PI/2,b=bends[i].x;
        const p=point(i%5===0?136:149,a),q=point(161,a,b*.4),r=point(174,a,b);
        el.setAttribute('d','M'+p.join(' ')+' Q'+q.join(' ')+' '+r.join(' '));
      });
      nodeEls.forEach((el,i)=>{
        const a=angle+i*STEP-Math.PI/2;
        el.style.left=(50+40.5*Math.cos(a))+'%';
        el.style.top=(50+40.5*Math.sin(a))+'%';
      });
      dial.dataset.phase=phase;
    }
    function flare(){
      if(!motionEnabled||motionQuery.matches)return;
      burst.innerHTML='<span class="ripple"></span>'+Array.from({length:12},(_,i)=>'<span class="spark" style="--a:'+(i*30+11)+'deg;--distance:-'+(150+i%3*12)+'px"></span>').join('');
      const ring=burst.firstElementChild;
      ring.addEventListener('animationend',()=>{if(burst.firstElementChild===ring)burst.replaceChildren();},{once:true});
    }
    function updateReadout(animate=false){
      const i=Number(selectedMonth.slice(5))-1,count=monthCount(i);
      const monthColors=[['#f0e0e6','#794c61'],['#e7ecdd','#50623e'],['#e0eaf2','#355c77']];
      const picked=getComputedStyle(document.querySelector('.filter[data-cat="'+activeCat+'"]'));
      dial.style.setProperty('--dial-fill',picked.getPropertyValue('--crm-bg').trim()||monthColors[i%3][0]);
      dial.style.setProperty('--dial-ink',picked.getPropertyValue('--crm-ink').trim()||monthColors[i%3][1]);
      document.querySelector(".dial-year").textContent=YEAR+" 年";
      document.getElementById('dial-number').textContent=String(i+1).padStart(2,'0');
      document.getElementById('dial-read').textContent=count?count+' 件紀錄・點選閱讀 ↗':'這個月沒有紀錄';
      center.setAttribute('aria-label',monthLabel(selectedMonth)+(count?'，'+count+' 件紀錄，點選閱讀':'，沒有紀錄'));
      document.getElementById('deck-caption').textContent=monthLabel(selectedMonth);
      nodeEls.forEach((el,j)=>{
        el.classList.toggle('has-record',monthCount(j)>0);
        el.setAttribute('aria-pressed',String(i===j));
        el.setAttribute('aria-label',monthLabel(monthKey(j))+'，'+monthCount(j)+' 件紀錄');
      });
      center.classList.remove('reveal');
      if(animate&&motionEnabled&&!motionQuery.matches){void center.offsetWidth;center.classList.add('reveal');flare();}
    }
    function syncDial(){
      stopSpin();angle=-(Number(selectedMonth.slice(5))-1)*STEP;targetAngle=angle;
      updateReadout();paint();
    }
    function commit(){
      const next=monthKey(monthFromAngle(angle)),changed=next!==selectedMonth;
      selectedMonth=next;updateReadout(changed);
      // Selection never creates a timeline event or alters chronological ordering.
    }
    function frame(now){
      raf=0;
      if(!shown||document.hidden)return;
      const dt=Math.min(2,(now-(previousTime||now-16.67))/16.67);previousTime=now;
      if(phase==='coast'){
        angle+=velocity*dt;velocity*=Math.pow(.93,dt);
        if(Math.abs(velocity)<.012||now-coastStarted>1200){phase='snap';targetAngle=Math.round(angle/STEP)*STEP;}
      }else if(phase==='snap'){
        velocity+=(targetAngle-angle)*.13*dt;velocity*=Math.pow(.67,dt);angle+=velocity*dt;
        if(Math.abs(targetAngle-angle)<.0006&&Math.abs(velocity)<.0006){angle=targetAngle;velocity=0;phase='idle';commit();}
      }
      let alive=phase!=='idle';
      bends.forEach((b,i)=>{
        const a=angle+i*TAU/60-Math.PI/2;
        const distance=hoverAngle===null?10:Math.abs(wrapAngle(a-hoverAngle));
        const want=(motionEnabled&&!motionQuery.matches)?Math.exp(-distance*distance*9)*(pointer?24:13)+velocity*32:0;
        b.v+=(want-b.x)*.16*dt;b.v*=Math.pow(.68,dt);b.x+=b.v*dt;
        if(Math.abs(b.x-want)>.03||Math.abs(b.v)>.03)alive=true;
      });
      paint();
      if(alive)raf=requestAnimationFrame(frame);else previousTime=0;
    }
    function wake(){if(!raf&&shown&&!document.hidden)raf=requestAnimationFrame(frame);}
    function goMonth(index){
      const desired=-modulo(index,12)*STEP;
      targetAngle=angle+wrapAngle(desired-angle);
      if(!motionEnabled||motionQuery.matches){angle=targetAngle;phase='idle';velocity=0;commit();paint();return;}
      velocity=0;phase='snap';wake();
    }
    function pointerAngle(e){
      const r=dial.getBoundingClientRect();
      return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2);
    }
    dial.addEventListener('pointerdown',e=>{
      if(e.button!==0||e.target.closest('.dial-center'))return;
      stopSpin();pointer={id:e.pointerId,angle:pointerAngle(e),last:e.timeStamp,x:e.clientX,y:e.clientY,moved:false,node:e.target.closest('.dial-node')};
      phase='drag';dial.setPointerCapture(e.pointerId);dial.classList.add('dragging');wake();
    });
    dial.addEventListener('pointermove',e=>{
      hoverAngle=pointerAngle(e);
      if(pointer&&pointer.id===e.pointerId){
        const delta=wrapAngle(hoverAngle-pointer.angle);
        if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>5)pointer.moved=true;
        if(pointer.moved){angle+=delta;velocity=Math.max(-.22,Math.min(.22,delta/Math.max(8,e.timeStamp-pointer.last)*16.67));}
        pointer.angle=hoverAngle;pointer.last=e.timeStamp;
      }
      if(motionEnabled&&!motionQuery.matches)wake();else paint();
    });
    function release(e,cancel=false){
      if(!pointer||pointer.id!==e.pointerId)return;
      const moved=pointer.moved,node=pointer.node;
      if(e.timeStamp-pointer.last>80)velocity=0;
      if(dial.hasPointerCapture(e.pointerId))dial.releasePointerCapture(e.pointerId);
      pointer=null;hoverAngle=null;dial.classList.remove('dragging');
      ignoreClick=moved;
      if(cancel){phase='idle';goMonth(Number(selectedMonth.slice(5))-1);}
      else if(moved){
        if(!motionEnabled||motionQuery.matches){angle=Math.round(angle/STEP)*STEP;phase='idle';commit();paint();}
        else{phase='coast';coastStarted=performance.now();wake();}
      }else{phase='idle';if(node){ignoreClick=true;goMonth(Number(node.dataset.index));}else wake();}
    }
    dial.addEventListener('pointerup',e=>release(e));
    dial.addEventListener('pointercancel',e=>release(e,true));
    dial.addEventListener('pointerleave',()=>{if(!pointer)hoverAngle=null;wake();});
    dial.addEventListener('click',e=>{
      if(ignoreClick){ignoreClick=false;return;}
      const node=e.target.closest('.dial-node');
      if(node)goMonth(Number(node.dataset.index));
    });
    center.addEventListener('click',()=>{
      const section=document.querySelector('.month[data-month="'+selectedMonth+'"]');
      if(!section){flare();return;}
      const button=section.querySelector('.month-toggle');
      if(button.getAttribute('aria-expanded')!=='true'){
        button.setAttribute('aria-expanded','true');animatePanel(section.querySelector('.month-panel'),true);
        storedState[activeCat+':'+selectedMonth]=true;saveState();
      }
      section.scrollIntoView({behavior:motionEnabled&&!motionQuery.matches?'smooth':'instant',block:'start'});
      button.focus({preventScroll:true});
    });
    dial.addEventListener('keydown',e=>{
      if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
        e.preventDefault();goMonth(monthFromAngle(targetAngle)+(e.key==='ArrowRight'?1:-1));
      }else if(e.key==='Escape'){stopSpin();goMonth(Number(selectedMonth.slice(5))-1);}
    });
    document.getElementById('prev-month').addEventListener('click',()=>goMonth(monthFromAngle(targetAngle)-1));
    document.getElementById('next-month').addEventListener('click',()=>goMonth(monthFromAngle(targetAngle)+1));
    document.getElementById('motion-toggle').addEventListener('click',()=>{motionEnabled=!motionEnabled;applyMotion();});
    motionQuery.addEventListener('change',()=>{motionEnabled=!motionQuery.matches;applyMotion();});
    new IntersectionObserver(entries=>{
      shown=entries[0].isIntersecting;
      if(!shown){stopSpin();angle=-(Number(selectedMonth.slice(5))-1)*STEP;targetAngle=angle;paint();}
    },{threshold:0}).observe(dial);
    document.addEventListener('visibilitychange',()=>{document.documentElement.dataset.pageHidden=String(document.hidden);if(document.hidden){stopSpin();angle=-(Number(selectedMonth.slice(5))-1)*STEP;targetAngle=angle;paint();}});

    const years=[...new Set([YEAR,...archiveMonths.map(m=>m.slice(0,4))])].sort();
    const yearSelect=document.getElementById('dial-year-select');
    yearSelect.innerHTML=years.map(y=>'<option value="'+y+'">'+y+' 年</option>').join('');
    yearSelect.value=YEAR;
    yearSelect.addEventListener('change',()=>{YEAR=yearSelect.value;selectedMonth=YEAR+'-'+selectedMonth.slice(5);syncDial();});
    applyMotion();
    render();
  
}
if(TL_PASS)boot(TL_PASS);
</script>
</body>
</html>
